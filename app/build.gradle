plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.markdave.lapit'
    compileSdk 34

    defaultConfig {
        applicationId "com.markdave.lapit"
        minSdk 24
        targetSdk 34
        // Each GitHub build gets a higher version so it installs over the old one
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    // Fixed key so every new build updates the app instead of needing an uninstall
    signingConfigs {
        lapit {
            storeFile file('lapit.jks')
            storePassword 'lapit123'
            keyAlias 'lapit'
            keyPassword 'lapit123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.lapit
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.lapit
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    implementation 'com.google.android.gms:play-services-nearby:19.3.0'
    implementation 'com.google.zxing:core:3.5.3'
}
